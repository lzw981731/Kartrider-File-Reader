name: Build RhoLoader

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/RhoLoader/RhoLoader.csproj

      - name: Build RhoLoader (Release AnyCPU)
        run: dotnet build src/RhoLoader/RhoLoader.csproj -c Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RhoLoader-build
          path: |
            src/RhoLoader/bin/Release/
          retention-days: 14